<!-- Brand tokens first (defines --forest, --off-white, etc. used as fallbacks
     by the inline :root below). Tenant overrides last (defines --accent-tenant
     and the [data-tenant-accent="true"] selector surface). -->

<style>
  /* ──────────────────────────────────────────────────────────────
     /card/[id] — Member card page (demo)
     Spec: white card, 1px border rgba(0,0,0,0.1), 16px radius,
     max-width 380px, centered on #F5F4F1.
     Playfair for name; DM Sans elsewhere. No shadows. No gradients.
     ────────────────────────────────────────────────────────────── */
  :root {
    --forest:        #0F6E56;
    --active:        #1D9E75;
    --mint:          #E1F5EE;
    --mint-text:     #085041;
    --deep-forest:   #0D1F1A;
    --off-white:     #F5F4F1;
    --paper:         #FFFFFF;
    --alert:         #E24B4A;
    --alert-soft:    #FCEBEB;
    --alert-text:    #791F1F;
    --gray-soft:     #ECEBE7;
    --gray-text:     #5C5B57;
    --ink:           #111111;
    --ink-soft:      #2A2A2A;
    --muted:         #888780;
    --hair:          rgba(0,0,0,0.1);
  }

  * { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  body {
    margin: 0;
    background: var(--off-white);
    color: var(--ink);
    font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
    font-weight: 400;
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
    display: flex; flex-direction: column;
  }
  ::selection { background: var(--forest); color: var(--off-white); }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; }

  /* ════════════ DEMO TOOLBAR ════════════ */
  .demo-bar {
    background: var(--deep-forest);
    color: rgba(245,244,241,0.85);
    padding: 10px clamp(14px, 4vw, 28px);
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    font-family: 'DM Mono', monospace;
    font-weight: 500;
    font-size: 10.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  .demo-bar .demo-label {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--mint);
  }
  .demo-bar .demo-label::before {
    content: ''; width: 7px; height: 7px; border-radius: 999px;
    background: var(--active);
  }
  .demo-bar .home {
    color: rgba(245,244,241,0.7);
    transition: color .15s;
  }
  .demo-bar .home:hover { color: var(--mint); }
  .demo-bar .spacer { flex: 1; }
  .demo-bar .switcher {
    display: inline-flex; gap: 4px;
    background: rgba(245,244,241,0.06);
    border: 0.5px solid rgba(245,244,241,0.18);
    padding: 3px;
    border-radius: 999px;
  }
  .demo-bar .switcher button {
    background: transparent;
    color: rgba(245,244,241,0.7);
    border: 0;
    padding: 6px 12px;
    border-radius: 999px;
    font-family: inherit;
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 500;
    transition: background .15s, color .15s;
  }
  .demo-bar .switcher button:hover { color: var(--off-white); }
  .demo-bar .switcher button.is-active {
    background: var(--off-white);
    color: var(--deep-forest);
  }

  /* ════════════ STAGE ════════════ */
  .stage {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    padding: clamp(28px, 6vw, 64px) 18px;
  }

  /* ════════════ THE CARD ════════════ */
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--paper);
    border: 1px solid var(--hair);
    border-radius: 16px;
    padding: 26px 26px 22px;
    overflow: hidden;
  }
  .card-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 26px;
  }
  .card-head .mark { width: 24px; height: 24px; flex: none; }
  .card-head .label {
    font-family: 'DM Mono', monospace;
    font-weight: 500;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .name {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 30px;
    line-height: 1.05;
    letter-spacing: -0.01em;
    color: var(--deep-forest);
    margin: 0 0 10px;
  }
  .union {
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    font-size: 14.5px;
    /* Falls back to --ink when no tenant theme is applied (apex preview,
       unresolved subdomain). Set by lib/tenant.js → applyTenantTheme(). */
    color: var(--accent-tenant, var(--ink));
    margin: 0 0 4px;
  }
  .local {
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 14px;
  }
  .since {
    font-family: 'DM Mono', monospace;
    font-weight: 500;
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    display: block;
    margin-bottom: 6px;
  }
  .since b {
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    font-size: 13.5px;
    color: var(--deep-forest);
    text-transform: none;
    letter-spacing: 0;
    margin-left: 8px;
  }

  /* Status badge */
  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 7px 13px;
    border-radius: 999px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    font-size: 12.5px;
    margin-top: 12px;
  }
  .badge .dot { width: 7px; height: 7px; border-radius: 999px; background: currentColor; }
  .badge.active    { background: var(--mint);       color: var(--mint-text); }
  .badge.inactive  { background: var(--gray-soft);  color: var(--gray-text); }
  .badge.suspended { background: var(--alert-soft); color: var(--alert-text); }

  /* Divider */
  .divider {
    height: 1px;
    background: var(--hair);
    margin: 22px 0 22px;
  }

  /* QR section */
  .qr-section { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .qr-frame {
    width: 200px; height: 200px;
    padding: 10px;
    background: #ffffff;
    border-radius: 10px;
    display: grid; place-items: center;
  }
  .qr-frame canvas, .qr-frame svg { width: 180px !important; height: 180px !important; }
  .qr-label {
    font-family: 'DM Mono', monospace;
    font-weight: 500;
    font-size: 10.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* Suspended panel (no QR) */
  .suspend-panel {
    margin-top: 4px;
    padding: 18px;
    border: 1px solid var(--alert-soft);
    border-radius: 12px;
    background: var(--alert-soft);
    color: var(--alert-text);
    font-size: 13.5px;
    line-height: 1.55;
    text-align: center;
  }
  .suspend-panel strong {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 17px;
    color: var(--alert-text);
    display: block;
    margin-bottom: 6px;
    letter-spacing: -0.005em;
  }

  .card-foot {
    margin-top: 22px;
    padding-top: 14px;
    border-top: 1px solid var(--hair);
    display: flex; align-items: center; justify-content: space-between;
    font-family: 'DM Mono', monospace;
    font-weight: 500;
    font-size: 9.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ════════════ NOT FOUND ════════════ */
  .notfound {
    width: 100%;
    max-width: 420px;
    text-align: center;
  }
  .notfound h1 {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 28px;
    line-height: 1.15;
    color: var(--deep-forest);
    margin: 0 0 12px;
    letter-spacing: -0.01em;
  }
  .notfound p {
    color: var(--ink-soft);
    margin: 0 0 22px;
    font-size: 14.5px;
  }
  .notfound .home-link {
    font-family: 'DM Mono', monospace;
    font-weight: 500;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--forest);
  }
  .notfound .home-link:hover { color: var(--deep-forest); }

  /* ════════════ SKELETON ════════════ */
  /* Brand-safe: solid placeholder with opacity pulse — no gradient. */
  .skeleton-bar {
    background: #ECEBE7;
    border-radius: 6px;
    animation: skel-pulse 1.4s ease-in-out infinite;
  }
  @keyframes skel-pulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.55; }
  }
  .skeleton .name-skel  { height: 28px; width: 70%; margin-bottom: 12px; }
  .skeleton .union-skel { height: 14px; width: 55%; margin-bottom: 8px; }
  .skeleton .local-skel { height: 12px; width: 40%; margin-bottom: 16px; }
  .skeleton .badge-skel { height: 28px; width: 110px; border-radius: 999px; margin-bottom: 22px; }
  .skeleton .qr-skel    { height: 200px; width: 200px; border-radius: 10px; margin: 0 auto 14px; }
  .skeleton .qr-label-skel { height: 10px; width: 160px; margin: 0 auto; }

  /* Powered by */
  .powered {
    text-align: center;
    padding: 18px 0 28px;
    font-family: 'DM Mono', monospace;
    font-weight: 500;
    font-size: 9.5px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
  }

  :focus-visible { outline: 2px solid var(--active); outline-offset: 3px; border-radius: 6px; }

  /* ════════════ MOTION & FEEDBACK ════════════ */
  /* Brand-safe: no shadows, no gradients, no blur. */

  /* Card / not-found enter: gentle rise + fade. Re-runs on every state swap. */
  .card, .notfound {
    animation: rise-in .42s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes rise-in {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
  }

  /* QR appears just after the card settles. */
  .qr-frame { animation: qr-in .55s cubic-bezier(.2,.7,.2,1) both .12s; }
  @keyframes qr-in {
    from { opacity: 0; transform: scale(0.94); }
    to   { opacity: 1; transform: scale(1); }
  }

  /* Active member pulse — quiet status of life. */
  .badge.active .dot { animation: dot-pulse 2.4s ease-in-out infinite; }
  @keyframes dot-pulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.4; }
  }

  /* Switcher buttons — press feedback. */
  .demo-bar .switcher button {
    transition: background .15s ease, color .15s ease, transform .12s ease;
  }
  .demo-bar .switcher button:active {
    transform: translateY(1px);
    transition-duration: .05s;
  }

  /* Reduced-motion: hard-stop. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
    .skeleton-bar, .badge.active .dot { animation: none !important; }
    .card, .notfound, .qr-frame { animation: none !important; opacity: 1 !important; transform: none !important; }
  }
</style>

<script>
  // ─── Supabase ───────────────────────────────────────────
  // Duplicates window.__UH_CONFIG__ from <head>; kept for backwards
  // compatibility with the prototype's inline pattern.
  const SUPABASE_URL = 'https://frdvhmzbsmczknqtexvx.supabase.co';

  // Set by the boot IIFE after lib/tenant.js resolves. Without this,
  // post-0002 RLS on members returns 0 rows and ?id= renders notfound.
  let currentTenantId = null;

  function sbHeaders(extra) {
    const h = {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`
    };
    if (currentTenantId) h['x-tenant-id'] = currentTenantId;
    if (extra) Object.assign(h, extra);
    return h;
  }

  async function fetchMemberById(id) {
    const url = `${SUPABASE_URL}/rest/v1/members?id=eq.${encodeURIComponent(id)}&select=*`;
    try {
      const res = await fetch(url, { headers: sbHeaders() });
      if (!res.ok) return null;
      const rows = await res.json();
      return rows[0] || null;
    } catch { return null; }
  }

  // Real seeded IDs so demo QR codes resolve to matching states via verify.html.
  const DEMO_IDS = {
    active:    '550bc413-53db-4f83-98e4-7c5c44d721d0',
    inactive:  '21e63983-9b15-4cd6-99e4-179e28cd001e',
    suspended: 'fd1be966-ca25-4e64-8a6a-d3402f1fdb58',
    notfound:  '00000000-0000-0000-0000-000000000000'
  };

  // Demo fallback — used when no ?id= is provided. Overwritten on live fetch.

  // The QR encodes a real verify URL. In demo mode we substitute one of the

    const isLive = !!new URLSearchParams(location.search).get('id');
    const id = isLive ? member.id : (DEMO_IDS[state] || member.id);
    return `${location.origin}${location.pathname.replace(/card\.html$/, '')}verify.html?id=${id}`;
  }

  // QR rendering (qrcode-generator). Level H, fg #111111, bg #ffffff, 180×180.
  function buildQr(value) {
    // Type 0 = auto pick the smallest version that fits at the given EC level.
    const qr = qrcode(0, 'H');
    qr.addData(value);
    qr.make();
    // 4-pixel cell, 4-cell quiet zone (matches level H best practice)
    return qr.createSvgTag({ cellSize: 4, margin: 4, scalable: true });
  }

  // Renderers — each returns the inner HTML for #root
  function renderCard(state) {
    const yr = memberSinceYear(member.member_since);
    const badgeMap = {
      active:    { cls: 'active',    label: 'Active Member' },
      inactive:  { cls: 'inactive',  label: 'Inactive' },
      suspended: { cls: 'suspended', label: 'Suspended' }
    };
    const b = badgeMap[state] || badgeMap.active;

    const qrSection = state === 'suspended'
      ? `<div class="suspend-panel" role="alert">
           <strong>Suspended.</strong>
           This membership has been suspended. Contact your union administrator.
         </div>`
      : `<div class="qr-section">
           <div class="qr-frame" id="qr"></div>
           <span class="qr-label">Scan to verify membership</span>
         </div>`;

    return `
      <article class="card" aria-label="Digital membership card">
        <header class="card-head">
          ${markSvg(26)}
          <span class="label">Digital Membership Card</span>
        </header>

        <h1 class="name">${member.full_name}</h1>
        <p class="union">${member.union_name}</p>
        <p class="local">Local ${member.local_number}</p>
        <span class="since">Member since <b>${yr}</b></span>

        <div class="badge ${b.cls}" role="status">
          <span class="dot"></span>${b.label}
        </div>

        <div class="divider"></div>

        ${qrSection}

        <footer class="card-foot">
          <span>The Union Hub</span>
          <span>UH–2026–104873</span>
        </footer>
      </article>`;
  }

  function renderSkeleton() {
    return `
      <article class="card skeleton" aria-busy="true" aria-label="Loading membership card">
        <header class="card-head">
          ${markSvg(26)}
          <span class="label">Digital Membership Card</span>
        </header>
        <div class="skeleton-bar name-skel"></div>
        <div class="skeleton-bar union-skel"></div>
        <div class="skeleton-bar local-skel"></div>
        <div class="skeleton-bar badge-skel"></div>
        <div class="divider"></div>
        <div class="skeleton-bar qr-skel"></div>
        <div class="skeleton-bar qr-label-skel"></div>
      </article>`;
  }

  function renderNotFound() {
    return `
      <div class="notfound" role="alert">
        ${markUnionHub(40)}
        <h1 style="margin-top:18px;">This membership card does <em style="color:var(--forest);font-style:italic;">not exist.</em></h1>
        <p>The link is invalid, expired, or was never issued. Ask your local for a new one.</p>
        <a class="home-link" href="index.html">← Back to The Union Hub</a>
      </div>`;
  }

  // State management
  const root = document.getElementById('root');

  function setState(state) {
    // Update toolbar active button
    document.querySelectorAll('.switcher button').forEach(btn => {
      btn.classList.toggle('is-active', btn.dataset.state === state);
    });
    // Update URL (without reload)
    const url = new URL(location.href);
    url.searchParams.set('state', state);
    history.replaceState(null, '', url);

    if (state === 'loading') {
      root.innerHTML = renderSkeleton();
      return;
    }
    if (state === 'notfound') {
      root.innerHTML = renderNotFound();
      return;
    }
    root.innerHTML = renderCard(state);
    // Render QR if applicable
    if (state !== 'suspended') {
      const target = document.getElementById('qr');
      if (target) target.innerHTML = buildQr(verifyUrl(state));
    }
  }

  // Bind switcher
  document.querySelectorAll('.switcher button').forEach(btn => {
    btn.addEventListener('click', () => setState(btn.dataset.state));
  });

  // Boot.
  // Live mode:  ?id=<uuid>  → fetch the row and render based on its status.
  // Demo mode:  ?state=<x>  → switcher / hardcoded fallback (preserves homepage CTAs).
  //
  // Before either path renders, we resolve the tenant from the hostname
  // (demo.theunionhub.com → 'demo' → public.tenants row) and patch the
  // union_name / local_number on `member` so the card paints the tenant's
  // identity, not the hardcoded prototype default. The CSS accent var is
  // applied by tenant.applyTenantTheme() — see lib/tenant.js.
  (async () => {
    const params = new URLSearchParams(location.search);
    const liveId = params.get('id');

    // Resolve the tenant in parallel with anything else. Fail-safe: any
    // error inside lib/tenant.js returns null and the page renders with
    // its hardcoded prototype defaults. The tenant id is also stamped
    // onto currentTenantId so sbHeaders() includes x-tenant-id on every
    // subsequent Supabase call (required by post-0002 RLS).
    let tenant = null;
    try {
      const tenantMod = await import('/lib/tenant.js');
      tenant = await tenantMod.getTenant();
      if (tenant) {
        currentTenantId = tenant.id;
        tenantMod.applyTenantTheme(tenant);
      }
    } catch (e) {
      console.warn('[uh/card] tenant module failed to load:', e && e.message ? e.message : e);
    }

    // Patch member identity fields from the tenant. The member row in
    // public.members carries denormalised copies post-0002, but the
    // tenant is the authoritative source — if it exists, it wins.
    function applyTenantToMember(m) {
      if (!tenant) return m;
      m.union_name   = tenant.display_name   || m.union_name;
      m.local_number = tenant.local_number   || m.local_number;
      return m;
    }

    if (liveId) {
      document.querySelector('.demo-bar')?.remove();
      setState('loading');
      const row = await fetchMemberById(liveId);
      if (!row) { setState('notfound'); return; }
      member = applyTenantToMember(row);
      const valid = ['active','inactive','suspended'].includes(row.status) ? row.status : 'notfound';
      setState(valid);
      return;
    }

    member = applyTenantToMember(member);
    const initial = params.get('state') || 'active';
    setState(['active','inactive','suspended','loading','notfound'].includes(initial) ? initial : 'active');
  })();
</script>

<script defer src="js/live.js"></script>

</body>
</html>
