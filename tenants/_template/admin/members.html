<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Members · Admin · The Union Hub</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0F6E56">

<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

<!-- Supabase runtime config is centralised in /lib/supabase.js (resolveConfig).
     The publishable anon key is RLS-safe and intentionally client-visible.
     A future edge middleware may inject window.__UH_CONFIG__ to override the
     defaults per environment; when absent, resolveConfig() supplies them.
     No credentials are hardcoded in this page. -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,700&family=DM+Sans:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/tenants/_template/tenant.css">
<link rel="stylesheet" href="/tenants/_template/admin/admin.css">
</head>

<body>

<nav class="admin-nav" role="navigation" aria-label="Admin">
  <div class="admin-nav-brand">
    <span class="mark" aria-hidden="true" data-tenant-initial>·</span>
    <div class="admin-nav-brand-stack">
      <span class="admin-nav-tenant-name" data-tenant-name>—</span>
      <span class="admin-nav-context">Admin</span>
    </div>
  </div>
  <div class="admin-nav-meta">
    <span class="admin-nav-email" data-admin-email>…</span>
    <button class="admin-btn admin-btn-ghost" type="button" data-signout>Sign out</button>
  </div>
</nav>

<nav class="admin-subnav" role="navigation" aria-label="Admin sections">
  <a href="/admin">Dashboard</a>
  <a href="/admin/members" aria-current="page">Members</a>
  <a href="/admin/grievances">Grievances</a>
  <a href="/admin/intelligence">Intelligence</a>
  <a href="/admin/team">Team</a>
  <a href="/admin/audit">Audit</a>
  <a href="/admin/site">Website</a>
  <a href="/admin/settings">Settings</a>
  <a href="/admin/access/dashboard" class="subnav-access">Access</a>
</nav>

<main class="admin-main">
  <header class="admin-page-head">
    <div class="admin-page-head-row">
      <div>
        <span class="admin-eyebrow"><span data-tenant-name>—</span> · Roster</span>
        <h1 class="admin-page-title">Members.</h1>
        <p class="admin-page-meta"><span data-total-line>Loading…</span></p>
      </div>
      <div class="admin-page-head-actions">
        <button type="button" class="admin-btn admin-btn-ghost" data-export>Export CSV</button>
        <a href="/admin/print"      class="admin-btn admin-btn-ghost">Print cards</a>
        <a href="/admin/import"     class="admin-btn admin-btn-ghost">Import CSV</a>
        <a href="/admin/member-new" class="admin-btn admin-btn-primary">+ Add member</a>
      </div>
    </div>
  </header>

  <div class="filter-bar">
    <div class="filter-chips" role="group" aria-label="Filter by status">
      <button class="filter-chip" type="button" data-status="" aria-pressed="true">All <span class="count" data-count="all">—</span></button>
      <button class="filter-chip" type="button" data-status="active"    aria-pressed="false">Active    <span class="count" data-count="active">—</span></button>
      <button class="filter-chip" type="button" data-status="inactive"  aria-pressed="false">Inactive  <span class="count" data-count="inactive">—</span></button>
      <button class="filter-chip" type="button" data-status="suspended" aria-pressed="false">Suspended <span class="count" data-count="suspended">—</span></button>
      <button class="filter-chip" type="button" data-status="pending"   aria-pressed="false">Pending   <span class="count" data-count="pending">—</span></button>
    </div>
    <label class="filter-search">
      <span class="visually-hidden">Search by name</span>
      <input type="search" placeholder="Search by name…" data-search autocomplete="off" aria-label="Search members by name">
    </label>
  </div>

  <table class="data-table" aria-label="Members">
    <thead>
      <tr>
        <th scope="col">Name</th>
        <th scope="col">Status</th>
        <th scope="col">Member since</th>
        <th scope="col" class="col-go" aria-hidden="true"></th>
      </tr>
    </thead>
    <tbody data-tbody>
      <tr><td colspan="4" class="data-table-empty">Loading…</td></tr>
    </tbody>
  </table>

  <div class="pagination" data-pagination hidden>
    <span data-page-label>Page 1 of 1</span>
    <div class="pagination-controls">
      <button type="button" data-page-prev>← Prev</button>
      <button type="button" data-page-next>Next →</button>
    </div>
  </div>
</main>

<footer class="admin-foot">
  <span>The Union Hub · Admin</span>
  <span>Signed in as <span data-admin-email-foot>…</span></span>
</footer>

<script type="module">
  import { requireAuth, watchAuth, signOut } from '/lib/auth-guard.js';
  import { getTenant, applyTenantTheme } from '/lib/tenant.js';
  import { listMembers, countByStatus } from '/lib/admin-members.js';

  const session = await requireAuth();
  if (!session) throw new Error('redirecting');

  let tenant = null;
  try {
    tenant = await getTenant();
    if (tenant) applyTenantTheme(tenant);
  } catch (e) { console.warn('[uh/admin/members] tenant resolve failed:', e?.message); }
  if (tenant?.slug) document.querySelector('[data-tenant-initial]').textContent = tenant.slug.charAt(0).toUpperCase();

  const email = session.user?.email || '—';
  document.querySelector('[data-admin-email]').textContent      = email;
  document.querySelector('[data-admin-email-foot]').textContent = email;
  watchAuth();
  document.querySelector('[data-signout]')?.addEventListener('click', signOut);

  // ─── State + URL sync ─────────────────────────────────────────────
  const state = (() => {
    const u = new URL(location.href);
    return {
      status: u.searchParams.get('status') || '',
      search: u.searchParams.get('q')      || '',
      page:   parseInt(u.searchParams.get('page') || '1', 10) || 1,
    };
  })();

  function syncUrl() {
    const u = new URL(location.href);
    state.status ? u.searchParams.set('status', state.status) : u.searchParams.delete('status');
    state.search ? u.searchParams.set('q', state.search)      : u.searchParams.delete('q');
    state.page > 1 ? u.searchParams.set('page', String(state.page)) : u.searchParams.delete('page');
    history.replaceState(null, '', u);
  }

  // ─── Initial input state from URL ─────────────────────────────────
  document.querySelectorAll('.filter-chip').forEach((c) => {
    c.setAttribute('aria-pressed', String(c.dataset.status === state.status));
  });
  document.querySelector('[data-search]').value = state.search;

  // ─── Bindings ─────────────────────────────────────────────────────
  document.querySelectorAll('.filter-chip').forEach((c) => {
    c.addEventListener('click', () => {
      state.status = c.dataset.status;
      state.page = 1;
      document.querySelectorAll('.filter-chip').forEach((x) => x.setAttribute('aria-pressed', String(x === c)));
      syncUrl();
      refresh();
    });
  });

  let searchTimer = null;
  document.querySelector('[data-search]').addEventListener('input', (e) => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      state.search = e.target.value.trim();
      state.page = 1;
      syncUrl();
      refresh();
    }, 250);
  });

  document.querySelector('[data-page-prev]').addEventListener('click', () => {
    if (state.page <= 1) return;
    state.page -= 1; syncUrl(); refresh();
  });
  document.querySelector('[data-page-next]').addEventListener('click', () => {
    state.page += 1; syncUrl(); refresh();
  });

  // ─── Rendering ────────────────────────────────────────────────────
  const STATUS_LABEL = { active: 'Active', inactive: 'Inactive', suspended: 'Suspended', pending: 'Pending' };
  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function fmtYear(d) { if (!d) return '—'; const y = new Date(d).getFullYear(); return isNaN(y) ? '—' : String(y); }

  function paintCounts(c) {
    document.querySelector('[data-count="all"]').textContent       = c.total;
    document.querySelector('[data-count="active"]').textContent    = c.active;
    document.querySelector('[data-count="inactive"]').textContent  = c.inactive;
    document.querySelector('[data-count="suspended"]').textContent = c.suspended;
    document.querySelector('[data-count="pending"]').textContent   = c.pending;
  }

  function paintList({ rows, total, page, totalPages }) {
    const tbody = document.querySelector('[data-tbody]');
    if (!rows.length) {
      tbody.innerHTML = `<tr><td colspan="4" class="data-table-empty">${
        state.search || state.status
          ? 'No members match the current filters.'
          : 'No members yet. Use the admin import tool to bring in your roster.'
      }</td></tr>`;
    } else {
      tbody.innerHTML = rows.map((m) => `
        <tr class="is-clickable" data-href="/admin/member?id=${encodeURIComponent(m.id)}">
          <td class="col-name">${escapeHtml(m.full_name || '—')}</td>
          <td>
            <span class="status-pill ${escapeHtml(m.status || '')}">
              <span class="dot" aria-hidden="true"></span>${escapeHtml(STATUS_LABEL[m.status] || m.status || '—')}
            </span>
          </td>
          <td class="col-meta">${fmtYear(m.member_since)}</td>
          <td class="col-go" aria-hidden="true">→</td>
        </tr>
      `).join('');
      tbody.querySelectorAll('tr.is-clickable').forEach((tr) => {
        tr.addEventListener('click', () => location.assign(tr.dataset.href));
      });
    }

    document.querySelector('[data-total-line]').textContent =
      `${total.toLocaleString()} member${total === 1 ? '' : 's'} total`;

    const pagEl = document.querySelector('[data-pagination]');
    if (totalPages > 1) {
      pagEl.hidden = false;
      document.querySelector('[data-page-label]').textContent = `Page ${page} of ${totalPages}`;
      document.querySelector('[data-page-prev]').disabled = page <= 1;
      document.querySelector('[data-page-next]').disabled = page >= totalPages;
    } else {
      pagEl.hidden = true;
    }
  }

  async function refresh() {
    document.querySelector('[data-tbody]').innerHTML =
      `<tr><td colspan="4" class="data-table-empty">Loading…</td></tr>`;
    try {
      const [list, counts] = await Promise.all([
        listMembers({ status: state.status || null, search: state.search || null, page: state.page }),
        countByStatus(),
      ]);
      paintCounts(counts);
      paintList(list);
    } catch (e) {
      console.error('[uh/admin/members] refresh failed:', e);
      document.querySelector('[data-tbody]').innerHTML =
        `<tr><td colspan="4" class="data-table-empty">Couldn't load members. Refresh to try again.</td></tr>`;
    }
  }

  // ─── CSV export ───────────────────────────────────────────────────
  // Fetches all members matching the CURRENT filter+search (so what you
  // see is what you export). Client-side Blob download — no backend.
  // Includes a card_url column so an offline copy still links each row
  // back to the live digital card.
  const CSV_COLS = ['id', 'full_name', 'status', 'member_since', 'union_name', 'local_number', 'card_url'];
  const EXPORT_CEILING = 1000;     // pilot scale; revisit if a tenant ever exceeds this.

  function csvCell(v) {
    // RFC 4180: quote if the cell contains a quote, comma, CR, or LF.
    // Double-up internal quotes. Always emit empty cell as "" so the
    // shape is unambiguous in spreadsheets that auto-detect types.
    if (v === null || v === undefined) return '';
    const s = String(v);
    return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  }

  function buildCsv(rows) {
    const lines = [CSV_COLS.join(',')];
    const origin = window.location.origin;
    for (const m of rows) {
      const cardUrl = `${origin}/card?id=${encodeURIComponent(m.id)}`;
      lines.push([
        m.id, m.full_name, m.status, m.member_since,
        m.union_name, m.local_number, cardUrl,
      ].map(csvCell).join(','));
    }
    // CRLF row separator: Excel on Windows is strict, everything else
    // accepts it. Leading BOM so Excel auto-detects UTF-8 for names
    // with diacritics (Okonkwo, Ñoño, etc.) instead of mangling them.
    return '﻿' + lines.join('\r\n') + '\r\n';
  }

  function downloadBlob(filename, content, mime) {
    const blob = new Blob([content], { type: mime });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    // Revoke after the click has a moment to register; immediate revoke
    // can race the download dialog on some browsers.
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function exportFilename(tenantSlug, statusFilter) {
    // YYYY-MM-DD in local time. ISO would carry timezone noise we don't
    // want in a filename.
    const d = new Date();
    const ymd = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    const slug = (tenantSlug || 'roster').replace(/[^a-z0-9-]/gi, '');
    const suffix = statusFilter ? `-${statusFilter}` : '';
    return `${slug}-roster${suffix}-${ymd}.csv`;
  }

  const exportBtn = document.querySelector('[data-export]');
  exportBtn?.addEventListener('click', async () => {
    if (exportBtn.disabled) return;
    const originalLabel = exportBtn.textContent;
    exportBtn.disabled  = true;
    exportBtn.textContent = 'Preparing…';
    try {
      const { rows, total } = await listMembers({
        status:   state.status || null,
        search:   state.search || null,
        page:     1,
        pageSize: EXPORT_CEILING,
      });
      if (!rows.length) {
        exportBtn.textContent = 'Nothing to export';
        setTimeout(() => { exportBtn.textContent = originalLabel; exportBtn.disabled = false; }, 1600);
        return;
      }
      if (total > EXPORT_CEILING) {
        // Don't silently truncate. Tell the admin what they got vs what
        // exists; they can narrow the filter and re-export the rest.
        console.warn(`[uh/admin/members] export capped at ${EXPORT_CEILING} of ${total} total rows.`);
      }
      const csv = buildCsv(rows);
      downloadBlob(
        exportFilename(tenant?.slug, state.status),
        csv,
        'text/csv;charset=utf-8',
      );
      exportBtn.textContent = `Exported ${rows.length}${total > EXPORT_CEILING ? ` of ${total}` : ''}`;
    } catch (e) {
      console.error('[uh/admin/members] export failed:', e);
      exportBtn.textContent = 'Export failed';
    } finally {
      setTimeout(() => { exportBtn.textContent = originalLabel; exportBtn.disabled = false; }, 1800);
    }
  });

  refresh();
</script>

</body>
</html>
