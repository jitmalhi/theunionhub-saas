<!-- Brand tokens first (defines the canonical greens used as fallbacks
     when --accent-tenant isn't set). Tenant overrides last (sets
     --accent-tenant on :root via lib/tenant.js). -->
<link rel="stylesheet" href="/css/tokens.css">
<style>
  /* ──────────────────────────────────────────────────────────────
     /verify/[id] — Verification result page (demo)
     Spec: full-screen result. No nav, no footer. One answer.
       - Verified  → bg #0F6E56, white text, ✓
       - Invalid   → bg #E24B4A, white text, ✗
       - NotFound  → bg #111111, white text
     Optimised for daylight readability on a phone.
     ────────────────────────────────────────────────────────────── */
  :root {
    --forest:        #0F6E56;
    --active:        #1D9E75;
    --mint:          #E1F5EE;
    --deep-forest:   #0D1F1A;
    --off-white:     #F5F4F1;
    --alert:         #E24B4A;
    --collected:     #E8863A;
    --ink:           #111111;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  body {
    margin: 0;
    font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
    font-weight: 300;
    font-size: 16px;
    line-height: 1.6;
    background: var(--off-white);
    color: var(--off-white);
    overscroll-behavior: none;
  }
  ::selection { background: rgba(255,255,255,0.25); color: #fff; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; }

  /* ════════════ DEMO TOOLBAR (kept minimal; hide on print) ════════════ */
  /* Brand-safe: solid bg, no backdrop-filter blur. */
  .demo-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 30;
    background: var(--deep-forest);
    color: rgba(245,244,241,0.85);
    padding: 9px clamp(14px, 4vw, 28px);
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    font-family: 'DM Mono', monospace;
    font-weight: 500;
    font-size: 10.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    border-bottom: 0.5px solid rgba(245,244,241,0.18);
  }
  .demo-bar .demo-label {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--mint);
  }
  .demo-bar .demo-label::before {
    content: ''; width: 7px; height: 7px; border-radius: 999px; background: var(--active);
  }
  .demo-bar .home {
    color: rgba(245,244,241,0.7);
    transition: color .15s;
  }
  .demo-bar .home:hover { color: var(--mint); }
  .demo-bar .spacer { flex: 1; }
  .switcher {
    display: inline-flex; gap: 4px;
    background: rgba(245,244,241,0.06);
    border: 0.5px solid rgba(245,244,241,0.18);
    padding: 3px;
    border-radius: 999px;
  }
  .switcher button {
    background: transparent;
    color: rgba(245,244,241,0.7);
    border: 0;
    padding: 6px 12px;
    border-radius: 999px;
    font-family: inherit;
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 500;
    transition: background .15s, color .15s;
  }
  .switcher button:hover { color: var(--off-white); }
  .switcher button.is-active {
    background: var(--off-white);
    color: var(--deep-forest);
  }

  /* ════════════ FULL-SCREEN RESULT ════════════ */
  .screen {
    min-height: 100dvh;
    min-height: 100vh;
    padding: 88px 22px 36px;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center;
    transition: background-color .25s ease;
  }
  /* Verified screen paints the tenant accent. Falls back to brand --forest
     when no tenant context is resolved (apex preview, unresolved subdomain). */
  .screen.verified  { background: var(--accent-tenant, var(--forest)); }
  .screen.invalid   { background: var(--alert); }
  .screen.collected { background: var(--collected); }
  .screen.notfound  { background: var(--ink); }

  /* Big icon */
  .icon-wrap {
    width: 96px; height: 96px;
    border-radius: 999px;
    display: grid; place-items: center;
    background: rgba(255,255,255,0.16);
    margin-bottom: 28px;
  }
  .icon-wrap svg { width: 56px; height: 56px; }

  .state-word {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-style: italic;
    font-size: clamp(56px, 12vw, 96px);
    line-height: 0.95;
    letter-spacing: -0.02em;
    margin: 0 0 26px;
    color: #ffffff;
  }
  .state-word.invalid-word { font-style: italic; }

  .name {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 24px;
    line-height: 1.15;
    letter-spacing: -0.005em;
    color: #ffffff;
    margin: 0 0 10px;
  }
  .ucol {
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    font-size: 16px;
    color: rgba(255,255,255,0.86);
    margin: 0 0 6px;
  }
  .since {
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    font-size: 15px;
    color: rgba(255,255,255,0.72);
    margin: 0 0 32px;
  }
  .since b { font-weight: 500; color: #ffffff; }

  .checked {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 10px 18px;
    background: rgba(255,255,255,0.14);
    border-radius: 999px;
    font-family: 'DM Mono', monospace;
    font-weight: 500;
    font-size: 11.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.92);
  }
  .checked .dot {
    width: 8px; height: 8px; border-radius: 999px; background: #ffffff;
    animation: blink 1.6s ease-in-out infinite;
  }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }

  /* "Mark as paid" button — lives on the verified screen only. */
  .paid-btn {
    appearance: none;
    border: 1px solid rgba(255,255,255,0.6);
    background: #ffffff;
    /* Reads through the tenant accent on the verified screen so the button
       label matches the surrounding background colour. */
    color: var(--accent-tenant, var(--forest));
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    font-size: 17px;
    letter-spacing: 0.01em;
    padding: 16px 32px;
    min-height: 56px;
    min-width: 240px;
    border-radius: 999px;
    cursor: pointer;
    margin: 0 0 14px;
    transition: background .15s ease, color .15s ease, opacity .15s ease, transform .12s ease, border-color .15s ease;
  }
  .paid-btn:hover  { background: var(--off-white); }
  .paid-btn:active { transform: translateY(1px); transition-duration: .05s; }
  .paid-btn[data-state="confirm"] {
    background: transparent;
    color: #ffffff;
    border-color: #ffffff;
  }
  .paid-btn[data-state="working"] {
    opacity: 0.75;
    cursor: default;
    pointer-events: none;
  }
  .paid-btn[data-state="done"] {
    background: transparent;
    color: #ffffff;
    border-color: rgba(255,255,255,0.6);
    cursor: default;
    pointer-events: none;
  }
  .paid-error {
    font-family: 'DM Sans', sans-serif;
    font-size: 13.5px;
    color: rgba(255,255,255,0.92);
    margin: 0 auto 22px;
    min-height: 18px;
    max-width: 32ch;
  }
  .screen .paid-btn,
  .screen .paid-error {
    animation: rise-in .55s cubic-bezier(.2,.7,.2,1) both .44s;
  }
  @media (prefers-reduced-motion: reduce) {
    .screen .paid-btn, .screen .paid-error {
      animation: none !important; opacity: 1 !important; transform: none !important;
    }
  }

  .invalid-msg {
    max-width: 30ch;
    font-size: 17px;
    color: rgba(255,255,255,0.92);
    margin: 0 auto 8px;

  .invalid-msg strong { font-weight: 500; }
  .invalid-status {
    font-family: 'DM Mono', monospace;
    font-weight: 500;
    font-size: 11.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.86);
    display: inline-block;
    margin-bottom: 26px;
  }
  .invalid-action {
    font-size: 15px;
    color: rgba(255,255,255,0.85);
    max-width: 28ch;
    margin: 0 auto 28px;
  }

  .powered {
    margin-top: 36px;
    font-family: 'DM Mono', monospace;
    font-weight: 500;
    font-size: 9.5px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.55);
  }
  .powered .mark { display: inline-block; vertical-align: -3px; margin-right: 8px; }

  /* Loading spinner — must be visible within ~1s on real load.
     Uses tenant accent so the load→verified transition is a single
     coherent colour, not a brand-green→tenant-accent flash. */
  .spinner-screen {
    background: var(--accent-tenant, var(--forest));
    min-height: 100dvh; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,0.85);
    font-family: 'DM Mono', monospace;
    font-weight: 500;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    gap: 14px;
  }
  .spinner {
    width: 22px; height: 22px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 999px;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Not-found tweaks */
  .screen.notfound .name        { color: var(--off-white); }
  .screen.notfound .icon-wrap   { background: rgba(255,255,255,0.10); }
  .screen.notfound .state-word  { color: var(--off-white); }
  .screen.notfound .invalid-msg { color: rgba(255,255,255,0.85); }

  :focus-visible { outline: 2px solid #ffffff; outline-offset: 3px; border-radius: 6px; }

  /* ════════════ MOTION & FEEDBACK ════════════ */
  /* Brand-safe staggered entrance for the result content.            */
  /* Icon pops; everything else rises in sequence behind it.          */

  .screen .icon-wrap      { animation: pop-in   .55s cubic-bezier(.2,.7,.2,1) both .04s; }
  .screen .state-word     { animation: rise-in  .55s cubic-bezier(.2,.7,.2,1) both .18s; }
  .screen .name           { animation: rise-in  .55s cubic-bezier(.2,.7,.2,1) both .26s; }
  .screen .ucol           { animation: rise-in  .55s cubic-bezier(.2,.7,.2,1) both .32s; }
  .screen .since          { animation: rise-in  .55s cubic-bezier(.2,.7,.2,1) both .38s; }
  .screen .invalid-msg    { animation: rise-in  .55s cubic-bezier(.2,.7,.2,1) both .26s; }
  .screen .invalid-status { animation: rise-in  .55s cubic-bezier(.2,.7,.2,1) both .32s; }
  .screen .invalid-action { animation: rise-in  .55s cubic-bezier(.2,.7,.2,1) both .38s; }
  .screen .checked        { animation: rise-in  .55s cubic-bezier(.2,.7,.2,1) both .50s; }
  .screen .powered        { animation: rise-in  .55s cubic-bezier(.2,.7,.2,1) both .60s; }

  @keyframes pop-in {
    from { opacity: 0; transform: scale(0.78); }
    to   { opacity: 1; transform: scale(1); }
  }
  @keyframes rise-in {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: none; }
  }

  /* Switcher buttons — press feedback. */
  .switcher button { transition: background .15s ease, color .15s ease, transform .12s ease; }
  .switcher button:active { transform: translateY(1px); transition-duration: .05s; }

  /* Reduced-motion: kill every choreographed animation; spinner stops too. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
    .screen .icon-wrap, .screen .state-word, .screen .name, .screen .ucol,
    .screen .since, .screen .invalid-msg, .screen .invalid-status,
    .screen .invalid-action, .screen .checked, .screen .powered {
      opacity: 1 !important; transform: none !important;
    }
  }
</style>

<script type="module">
  // ─── Supabase ───────────────────────────────────────────
  // Credentials come from the central runtime config in /lib/supabase.js.
  // No hardcoded keys on this page: resolveConfig() resolves the URL +
  // publishable anon key (env / window.__UH_CONFIG__ / RLS-safe prod fallback).
  import { resolveConfig } from '/lib/supabase.js';
  const { url: SUPABASE_URL, anonKey: SUPABASE_KEY } = resolveConfig();

  // Set by the boot IIFE after lib/tenant.js resolves. Threaded into every
  // Supabase REST call via sbHeaders() so RLS policies (from migration
  // 0002 onward) see the correct tenant context. Without this header,
  // anon SELECT on members returns 0 rows.
  let currentTenant   = null;
  let currentTenantId = null;

  function sbHeaders(extra) {
    const h = {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`
    };
    if (currentTenantId) h['x-tenant-id'] = currentTenantId;
    if (extra) Object.assign(h, extra);
    return h;
  }

  async function fetchMemberById(id) {
    // Goes through the lookup_member SECURITY DEFINER RPC because anon's
    // direct SELECT on public.members was removed in migration 0008.
    // The RPC reads x-tenant-id itself, filters server-side, and only
    // returns the display fields this page paints.
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/lookup_member`, {
        method: 'POST',
        headers: sbHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ p_id: id })
      });
      if (!res.ok) return null;
      const rows = await res.json();
      return (Array.isArray(rows) ? rows[0] : rows) || null;
    } catch { return null; }
  }

  // Fire-and-forget. Never block the UI on logging.
  function recordVerification(memberId, result) {
    try {
      fetch(`${SUPABASE_URL}/rest/v1/rpc/record_verification`, {
        method: 'POST',
        headers: sbHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ p_member_id: memberId, p_result: result }),
        keepalive: true
      }).catch(() => {});
    } catch {}
  }

  async function checkAlreadyCollected(memberId) {
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/check_already_collected`, {
        method: 'POST',
        headers: sbHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ p_member_id: memberId })
      });
      if (!res.ok) return { already: false, paid_at: null };
      const rows = await res.json();
      const row = Array.isArray(rows) ? rows[0] : rows;
      return row || { already: false, paid_at: null };
    } catch { return { already: false, paid_at: null }; }
  }

  async function markMemberPaid(memberId) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/mark_member_paid`, {
      method: 'POST',
      headers: sbHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ p_member_id: memberId })
    });
    if (!res.ok) throw new Error('mark_failed');
    const rows = await res.json();
    return (Array.isArray(rows) ? rows[0] : rows) || { was_already_paid: false, paid_at: null };
  }

  // Demo fallback — used when no ?id= is provided. Overwritten on live fetch.
  let member = {
    id: '550bc413-53db-4f83-98e4-7c5c44d721d0',
    full_name: 'Maya Okonkwo',

    local_number: '79',
    member_since: '2019-04-12',
    status: 'active'
  };

  function memberSinceYear(d) { return new Date(d).getFullYear(); }

  function timeNow() {
    return new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }

    </svg>`;

  const checkSvg = `
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <path d="M14 34 L26 46 L50 18" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="square" stroke-linejoin="miter"/>
    </svg>`;

  const xSvg = `
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <path d="M18 18 L46 46 M46 18 L18 46" stroke="#FFFFFF" stroke-width="7" stroke-linecap="square" stroke-linejoin="miter"/>
    </svg>`;

  const qSvg = `
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="32" r="22" fill="none" stroke="#FFFFFF" stroke-width="4"/>
      <path d="M26 26 a6 6 0 1 1 8 8 v4" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="square"/>
      <rect x="30" y="44" width="4" height="4" fill="#FFFFFF"/>
    </svg>`;

  function renderVerified() {
    const yr = memberSinceYear(member.member_since);
    return `
      <section class="screen verified" role="status" aria-live="polite">
        <div class="icon-wrap">${checkSvg}</div>
        <h1 class="state-word">Verified.</h1>
        <p class="name">${member.full_name}</p>
        <p class="ucol">${member.union_name} · Local ${member.local_number}</p>
        <p class="since">Active member <b>since ${yr}</b></p>
        <button class="paid-btn" type="button" data-state="idle" data-paid-btn>Mark as paid</button>
        <p class="paid-error" data-paid-error></p>
        <span class="checked"><span class="dot"></span>Checked at ${timeNow()}</span>
        <div class="powered">${markSvg}Powered by The Union Hub</div>
      </section>`;
  }

  function renderInvalid(reason = 'Inactive') {
    return `
      <section class="screen invalid" role="alert" aria-live="assertive">
        <div class="icon-wrap">${xSvg}</div>
        <h1 class="state-word invalid-word">Not&nbsp;valid.</h1>
        <p class="invalid-msg"><strong>This membership is not currently active.</strong></p>
        <p class="invalid-status">Status · ${reason}</p>
        <p class="invalid-action">Contact your union administrator.</p>
        <span class="checked"><span class="dot"></span>Checked at ${timeNow()}</span>
        <div class="powered">${markSvg}Powered by The Union Hub</div>
      </section>`;
  }

  function renderNotFound() {
    return `
      <section class="screen notfound" role="alert" aria-live="assertive">
        <div class="icon-wrap">${qSvg}</div>
        <h1 class="state-word">Not&nbsp;found.</h1>
        <p class="invalid-msg">This card could not be verified. It may be invalid or expired.</p>
        <span class="checked" style="margin-top:16px;"><span class="dot"></span>Checked at ${timeNow()}</span>
        <div class="powered">${markSvg}Powered by The Union Hub</div>
      </section>`;
  }

  function renderAlreadyCollected(paidAt) {
    const t = paidAt
      ? new Date(paidAt).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
      : timeNow();
    return `
      <section class="screen collected" role="alert" aria-live="assertive">
        <div class="icon-wrap">${checkSvg}</div>
        <h1 class="state-word">Already&nbsp;collected.</h1>
        <p class="name">${member.full_name}</p>
        <p class="invalid-status">Verified and paid at ${t}</p>
        <span class="checked"><span class="dot"></span>Checked at ${timeNow()}</span>
        <div class="powered">${markSvg}Powered by The Union Hub</div>
      </section>`;
  }

  function renderLoading() {
    return `
      <section class="spinner-screen" role="status" aria-live="polite">
        <span class="spinner" aria-hidden="true"></span>
        Checking roster…
      </section>`;
  }

  const screen = document.getElementById('screen');

  // Two-tap confirm pattern for the "Mark as paid" button.
  // Demo mode (no ?id= in URL) skips the RPC and just toggles UI.
  function bindPaidButton() {
    const btn = document.querySelector('[data-paid-btn]');
    const err = document.querySelector('[data-paid-error]');
    if (!btn) return;

    const isDemo  = !new URLSearchParams(location.search).get('id');
    const memberId = member && member.id;
    let confirmTimer = null;

    function resetIdle() {
      btn.dataset.state = 'idle';
      btn.textContent = 'Mark as paid';
    }

    function setDone(paidAt) {
      const t = paidAt
        ? new Date(paidAt).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
        : timeNow();
      btn.dataset.state = 'done';
      btn.textContent = `Paid at ${t} ✓`;
      btn.setAttribute('aria-disabled', 'true');
    }

    btn.addEventListener('click', async () => {
      if (btn.dataset.state === 'done' || btn.dataset.state === 'working') return;

      if (btn.dataset.state === 'idle') {
        btn.dataset.state = 'confirm';
        btn.textContent = 'Tap again to confirm';
        try { navigator.vibrate && navigator.vibrate(15); } catch {}
        clearTimeout(confirmTimer);
        confirmTimer = setTimeout(resetIdle, 3000);
        return;
      }

      // confirm tap
      clearTimeout(confirmTimer);
      btn.dataset.state = 'working';
      btn.textContent = 'Marking…';
      err.textContent = '';

      if (isDemo || !memberId) {
        setTimeout(() => setDone(new Date().toISOString()), 350);
        return;
      }

      try {
        const out = await markMemberPaid(memberId);
        setDone(out && out.paid_at);
      } catch {
        err.textContent = "Couldn't mark paid — tap to retry.";
        resetIdle();
      }
    });
  }

  function setResult(result, reason) {
    document.querySelectorAll('.switcher button').forEach(btn => {
      btn.classList.toggle('is-active', btn.dataset.result === result);
    });
    const url = new URL(location.href);
    // Don't pollute the URL with ?result= when this is a real lookup.
    if (!url.searchParams.get('id')) {
      url.searchParams.set('result', result);
      history.replaceState(null, '', url);
    }

    // Match meta theme-color for nicer mobile chrome bars. Verified and
    // loading share the tenant accent so the colour transition into the
    // verified screen is continuous; non-success states stay canonical
    // (the verifier needs to see red/amber/black unambiguously).
    const tenantAccent = currentTenant && currentTenant.accent_hex;
    const themeMap = { verified: '#0F6E56', invalid: '#E24B4A', collected: '#E8863A', notfound: '#111111', loading: '#0F6E56' };
    const theme = (result === 'verified' || result === 'loading') && tenantAccent
      ? tenantAccent
      : (themeMap[result] || '#0F6E56');
    document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme);

    if (result === 'loading')   { screen.innerHTML = renderLoading(); return; }
    if (result === 'invalid')   { screen.innerHTML = renderInvalid(reason || 'Inactive'); return; }
    if (result === 'collected') { screen.innerHTML = renderAlreadyCollected(reason); return; }
    if (result === 'notfound')  { screen.innerHTML = renderNotFound(); return; }
    screen.innerHTML = renderVerified();
    bindPaidButton();
  }

  // Bind switcher
  document.querySelectorAll('.switcher button').forEach(btn => {
    btn.addEventListener('click', () => setResult(btn.dataset.result));
  });

  // Boot.
  // Live mode:  ?id=<uuid>  → fetch the row and derive verified/invalid/notfound.
  // Demo mode:  ?result=<x> → switcher / hardcoded fallback.
  //
  // Before either path, resolve the tenant from the hostname and:
  //   1. Store its id in currentTenantId so every Supabase REST call
  //      thereafter carries x-tenant-id (required by post-0002 RLS).
  //   2. Apply --accent-tenant so the verified screen paints the tenant
  //      colour instead of brand --forest.
  //   3. Patch member.union_name / member.local_number so the .ucol line
  //      reflects the tenant's identity, not the prototype default.
  (async () => {
    const params = new URLSearchParams(location.search);
    const liveId = params.get('id');

    // Tenant resolution — fail-safe: any error returns null and we render
    // with the hardcoded prototype defaults (verifier still gets a usable
    // answer even if Supabase blips or lib/tenant.js fails to load).
    try {
      const tenantMod = await import('/lib/tenant.js');
      currentTenant = await tenantMod.getTenant();
      if (currentTenant) {
        currentTenantId = currentTenant.id;
        tenantMod.applyTenantTheme(currentTenant);
      }
    } catch (e) {
      console.warn('[uh/verify] tenant module failed to load:', e && e.message ? e.message : e);
    }

    // Patch denormalised identity fields from the tenant (authoritative).
    function applyTenantToMember(m) {
      if (!currentTenant) return m;
      m.union_name   = currentTenant.display_name || m.union_name;
      m.local_number = currentTenant.local_number || m.local_number;
      return m;
    }

    if (liveId) {
      document.querySelector('.demo-bar')?.remove();
      setResult('loading');
      const row = await fetchMemberById(liveId);
      if (!row) { setResult('notfound'); return; }
      member = applyTenantToMember(row);

      if (row.status === 'active') {
        const check = await checkAlreadyCollected(row.id);
        if (check && check.already) {
          recordVerification(row.id, 'already_collected');
          setResult('collected', check.paid_at);
        } else {
          recordVerification(row.id, 'verified');
          setResult('verified');
        }
        return;
      }

      const reason = row.status.charAt(0).toUpperCase() + row.status.slice(1);
      recordVerification(row.id, 'invalid');
      setResult('invalid', reason);
      return;
    }

    member = applyTenantToMember(member);
    const initial = params.get('result') || 'verified';
    const target = ['loading','verified','invalid','collected','notfound'].includes(initial) ? initial : 'verified';
    if (target === 'loading') {
      setResult('loading');
    } else {
      setResult('loading');
      // Demo-mode 'collected' uses a mock paid time so the screen renders fully.
      const reason = target === 'collected' ? new Date(Date.now() - 42 * 60 * 1000).toISOString() : undefined;
      setTimeout(() => setResult(target, reason), 650);
    }
  })();
</script>
