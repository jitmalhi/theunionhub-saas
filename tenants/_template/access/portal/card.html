<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Your Steward Card · The Union Hub Access</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Your official representative identity.">
<meta name="theme-color" content="#0F6E56">
<meta name="robots" content="noindex,nofollow">

<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,700&family=DM+Sans:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/tenants/_template/tenant.css">
<link rel="stylesheet" href="/tenants/_template/access/portal/portal.css">

<style>
  /* ── Steward Card · official identity. Brand: hairlines, no shadow/gradient,
        Playfair headers, DM Sans body, tenant accent. ── */

  .stage { perspective: 1600px; margin: 6px 0 30px; }
  .flip-card { position: relative; min-height: 520px; }
  .flip-inner { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .6s cubic-bezier(.2,.7,.2,1); }
  .flip-card.is-flipped .flip-inner { transform: rotateY(180deg); }

  .face {
    position: absolute; inset: 0;
    -webkit-backface-visibility: hidden; backface-visibility: hidden;
    display: flex; flex-direction: column;
    border: 0.5px solid var(--hair, rgba(0,0,0,0.15));
    border-radius: var(--rad, 12px);
    background: var(--paper, #FAF9F5);
    padding: clamp(22px, 5vw, 32px);
    overflow: hidden;
  }
  .face.back { transform: rotateY(180deg); }

  /* Accent header strip — the "institution" cue. */
  .face::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: var(--accent-tenant, var(--forest, #0F6E56));
  }

  .card-eyebrow {
    font-family: var(--font-mono, 'DM Mono', monospace);
    font-weight: 500; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--accent-tenant, var(--forest, #0F6E56));
    display: inline-flex; align-items: center; gap: 8px; margin: 6px 0 18px;
  }
  .card-eyebrow::before { content: ''; width: 6px; height: 6px; border-radius: 999px; background: currentColor; }

  .card-id { display: flex; align-items: center; gap: 16px; margin: 0 0 18px; }
  .avatar {
    width: 64px; height: 64px; flex: none; border-radius: 999px; overflow: hidden;
    display: grid; place-items: center;
    background: var(--accent-tenant, var(--forest, #0F6E56)); color: #fff;
    font-family: var(--font-display, 'Playfair Display', serif); font-weight: 700; font-size: 26px;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .card-name {
    font-family: var(--font-display, 'Playfair Display', serif); font-weight: 700;
    font-size: clamp(24px, 6vw, 30px); line-height: 1.1; letter-spacing: -0.01em;
    color: var(--deep-forest, #0D1F1A); margin: 0 0 3px;
  }
  .card-role { font-size: 14px; font-weight: 500; color: var(--accent-tenant, var(--forest, #0F6E56)); margin: 0; }
  .card-org { font-size: 13.5px; color: var(--ink-soft, #2A2A2A); margin: 2px 0 0; }

  .auth-badge {
    align-self: flex-start;
    display: inline-flex; align-items: center; gap: 7px;
    padding: 6px 13px; border-radius: 999px;
    background: var(--accent-tenant, var(--forest, #0F6E56)); color: #fff;
    font-family: var(--font-mono, 'DM Mono', monospace); font-weight: 500;
    font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    margin: 0 0 18px;
  }
  .auth-badge .check { font-size: 11px; }

  /* QR — central, prominent. */
  .qr-wrap { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .qr-frame {
    width: 188px; height: 188px; padding: 12px; box-sizing: content-box;
    border: 0.5px solid var(--hair, rgba(0,0,0,0.15)); border-radius: var(--rad-sm, 10px);
    background: #fff; display: grid; place-items: center;
  }
  .qr-frame svg { width: 188px !important; height: 188px !important; display: block; }
  .qr-label {
    font-family: var(--font-mono, 'DM Mono', monospace); font-size: 10px;
    letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted, #888780); text-align: center;
  }

  /* Flip toggle — small + elegant. */
  .flip-toggle {
    position: absolute; top: 18px; right: 18px;
    appearance: none; cursor: pointer; background: transparent;
    border: 0.5px solid var(--hair, rgba(0,0,0,0.15)); border-radius: 999px;
    padding: 6px 12px;
    font-family: var(--font-mono, 'DM Mono', monospace); font-size: 9.5px;
    letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft, #2A2A2A);
    display: inline-flex; align-items: center; gap: 6px; z-index: 2;
    transition: border-color .15s ease, color .15s ease;
  }
  .flip-toggle:hover { border-color: var(--accent-tenant, var(--forest, #0F6E56)); color: var(--accent-tenant, var(--forest, #0F6E56)); }

  /* Card back — Representation Ledger. */
  .ledger-lead { font-size: 14.5px; line-height: 1.55; color: var(--ink-soft, #2A2A2A); margin: 2px 0 20px; }
  .ledger-stat {
    display: flex; align-items: baseline; gap: 10px; margin: 0 0 22px;
  }
  .ledger-num { font-family: var(--font-display, 'Playfair Display', serif); font-weight: 700; font-size: 44px; line-height: 1; color: var(--deep-forest, #0D1F1A); }
  .ledger-num-label { font-family: var(--font-mono, 'DM Mono', monospace); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted, #888780); }
  .ledger-cta { margin-top: auto; }

  /* Active Representation (below the card). */
  .active-head {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    margin: 0 0 12px;
  }
  .active-title { font-family: var(--font-mono, 'DM Mono', monospace); font-weight: 500; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted, #888780); }
  .active-all { font-family: var(--font-mono, 'DM Mono', monospace); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent-tenant, var(--forest, #0F6E56)); }
  .active-list { display: flex; flex-direction: column; border: 0.5px solid var(--hair, rgba(0,0,0,0.15)); border-radius: var(--rad, 12px); overflow: hidden; background: var(--paper, #FAF9F5); }
  .active-row { display: flex; align-items: center; gap: 12px; padding: 15px 16px; border-bottom: 0.5px solid var(--hair, rgba(0,0,0,0.15)); text-decoration: none; color: inherit; transition: background .15s ease; }
  .active-row:last-child { border-bottom: 0; }
  .active-row:hover { background: var(--off-white, #F5F4F1); text-decoration: none; }
  .active-row .main { flex: 1; min-width: 0; }
  .active-row .t { display: block; font-family: var(--font-body, 'DM Sans', sans-serif); font-weight: 500; font-size: 15px; color: var(--ink, #111); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .active-row .m { display: block; font-family: var(--font-mono, 'DM Mono', monospace); font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted, #888780); margin-top: 3px; }
  .active-row .go { color: var(--muted, #888780); flex: none; }
  .active-empty { padding: 22px 16px; font-size: 13.5px; color: var(--muted, #888780); }

  @media (prefers-reduced-motion: reduce) {
    .flip-inner { transition: none; }
  }
</style>
</head>

<body>
  <main class="portal-wrap" id="root">
    <section class="card center" data-loading>
      <div class="spinner" aria-hidden="true"></div>
      <p class="status">Loading your card…</p>
    </section>
  </main>

<!-- QR generator (Kazuhiko Arase) — classic script, exposes global `qrcode`. -->
<script src="/lib/qrcode.js"></script>
<script type="module">
  import { getTenant, applyTenantTheme } from '/lib/tenant.js';
  import createClient from '/lib/supabase.js';

  const LOGIN = '/access/portal/login';
  const root = document.getElementById('root');

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function initials(name) {
    const p = String(name || '').trim().split(/\s+/);
    return (((p[0] || '')[0] || '') + (p.length > 1 ? (p[p.length - 1][0] || '') : '')).toUpperCase();
  }
  function fmtDate(iso) {
    if (!iso) return '—';
    const d = new Date(iso); if (isNaN(d)) return '—';
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }
  function buildQrSvg(value) {
    const qr = qrcode(0, 'H');           // global from /lib/qrcode.js
    qr.addData(value);
    qr.make();
    return qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
  }
  function showCenter(html) { root.innerHTML = `<section class="card center">${html}</section>`; }

  // ── Boot ────────────────────────────────────────────────
  (async () => {
    let tenant = null;
    try { tenant = await getTenant({ force: true }); if (tenant) applyTenantTheme(tenant); }
    catch (e) { console.warn('[uh/card] tenant resolve failed:', e?.message); }
    if (!tenant) {
      showCenter(`<h1>Wrong <em>address</em>.</h1><p class="lede">Open your card from your union's web address.</p>`);
      return;
    }

    const supabase = createClient({ tenantId: tenant.id });
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) { location.replace(`${LOGIN}?next=${encodeURIComponent('/access/portal/card')}`); return; }
    const uid = session.user?.id;

    // Resolve the steward's own row (claim by email if first sign-in).
    let rep = await findOwnRow(supabase, uid);
    if (!rep) { try { const { data } = await supabase.rpc('claim_representative', {}); rep = Array.isArray(data) ? data[0] : data; } catch {} }
    if (!rep) {
      showCenter(`
        <h1>No profile <em>yet</em>.</h1>
        <p class="lede">Set up your representative profile first, then your card will be ready.</p>
        <div class="actions"><a class="btn btn-primary" href="/access/portal">Go to profile</a></div>`);
      return;
    }
    if (rep.status && rep.status !== 'active') {
      showCenter(`<h1>Card <em>inactive</em>.</h1><p class="lede">Your representative status isn't active. Contact your union admin.</p>`);
      return;
    }

    const active = await fetchActive(supabase, uid);
    render(tenant, rep, session.user?.email || '', active);
  })();

  async function findOwnRow(supabase, uid) {
    if (!uid) return null;
    try {
      const { data } = await supabase.from('stewards')
        .select('id,full_name,title,role,worksite,status,user_id').eq('user_id', uid).limit(1);
      return (Array.isArray(data) ? data[0] : data) || null;
    } catch { return null; }
  }
  async function fetchActive(supabase, uid) {
    // Last 3 captures = cases actively being worked. RLS scopes to the steward.
    try {
      const { data } = await supabase.from('knowledge_entries')
        .select('id,title,issue_type,updated_at').order('updated_at', { ascending: false }).limit(3);
      return Array.isArray(data) ? data : [];
    } catch { return []; }
  }

  const ROLE_LABEL = { executive: 'Executive', unit_officer: 'Unit Officer', steward: 'Shop Steward' };

  function render(tenant, rep, email, active) {
    const org = [tenant.display_name, tenant.local_number ? `Local ${tenant.local_number}` : ''].filter(Boolean).join(' · ');
    const roleLabel = ROLE_LABEL[rep.role] || rep.title || 'Steward';
    const avatar = rep.photo_url
      ? `<span class="avatar"><img src="${esc(rep.photo_url)}" alt="${esc(rep.full_name)}"></span>`
      : `<span class="avatar" aria-hidden="true">${esc(initials(rep.full_name))}</span>`;

    // The QR points members to the meeting / interaction-log view for this steward.
    const meetUrl = `${location.origin}/meet/${encodeURIComponent(rep.id)}`;
    const qrSvg = buildQrSvg(meetUrl);

    const activeHtml = active.length
      ? `<div class="active-list">${active.map((a) => `
          <a class="active-row" href="/access/portal/knowledge?entry=${encodeURIComponent(a.id)}">
            <span class="main">
              <span class="t">${esc(a.title || 'Untitled case')}</span>
              <span class="m">${a.issue_type ? esc(a.issue_type) + ' · ' : ''}Updated ${esc(fmtDate(a.updated_at))}</span>
            </span>
            <span class="go" aria-hidden="true">→</span>
          </a>`).join('')}</div>`
      : `<div class="active-list"><p class="active-empty">No active cases yet. Captures you start will appear here to resume.</p></div>`;

    root.innerHTML = `
      <div class="topbar">
        <div class="who"><div class="label">Steward</div><div class="email">${esc(email || rep.full_name)}</div></div>
        <a class="signout" href="/access/portal" style="text-decoration:none">← Profile</a>
      </div>

      <div class="stage">
        <div class="flip-card" data-flip>
          <div class="flip-inner">
            <!-- FRONT: identity + QR -->
            <section class="face front" aria-label="Steward card front">
              <button class="flip-toggle" type="button" data-flip-btn>Ledger ⤿</button>
              <span class="card-eyebrow">${esc(tenant.display_name || 'The Union Hub')}</span>
              <div class="card-id">
                ${avatar}
                <div>
                  <h1 class="card-name">${esc(rep.full_name)}</h1>
                  <p class="card-role">${esc(roleLabel)}</p>
                  ${org ? `<p class="card-org">${esc(org)}</p>` : ''}
                </div>
              </div>
              <span class="auth-badge"><span class="check" aria-hidden="true">✓</span> Authorized Representative</span>
              <div class="qr-wrap">
                <div class="qr-frame">${qrSvg}</div>
                <span class="qr-label">Member scan · log a representation meeting</span>
              </div>
            </section>

            <!-- BACK: Representation Ledger / My Captures shortcut -->
            <section class="face back" aria-label="Representation ledger">
              <button class="flip-toggle" type="button" data-flip-btn>Card ⤾</button>
              <span class="card-eyebrow">Representation Ledger</span>
              <p class="ledger-lead">Every case you've captured — the institutional memory behind your representation.</p>
              <div class="ledger-stat">
                <span class="ledger-num">${active.length ? '' : '0'}${active.length ? '·' : ''}</span>
                <span class="ledger-num-label" data-ledger-note>Recent activity below</span>
              </div>
              <div class="ledger-cta">
                <a class="btn btn-primary" href="/access/portal/knowledge">Open My Captures</a>
              </div>
            </section>
          </div>
        </div>
      </div>

      <section aria-label="Active representation">
        <div class="active-head">
          <span class="active-title">Active Representation</span>
          <a class="active-all" href="/access/portal/knowledge">All →</a>
        </div>
        ${activeHtml}
      </section>

      <p class="powered">Secured by The Union Hub Access</p>`;

    // Tidy the ledger stat (we don't have a true total here without a count query).
    const note = root.querySelector('[data-ledger-note]');
    if (note) {
      root.querySelector('.ledger-num').textContent = String(active.length);
      note.textContent = active.length === 1 ? 'recent case' : 'recent cases';
    }

    // Flip wiring.
    const flip = root.querySelector('[data-flip]');
    root.querySelectorAll('[data-flip-btn]').forEach((b) =>
      b.addEventListener('click', () => flip.classList.toggle('is-flipped')));
  }
</script>
</body>
</html>
